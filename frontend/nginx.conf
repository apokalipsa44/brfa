server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST + SSE: forward everything under /api to the backend service. The upstream is
    # resolved at request time through Docker's embedded DNS (127.0.0.11) via a variable,
    # so nginx starts even when the backend container is not up yet (otherwise nginx aborts
    # with `host not found in upstream "backend"`). Buffering is disabled so the single
    # /api/events SSE stream is flushed immediately.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Never cache index.html: it references content-hashed bundles, so a stale copy
    # would request a JS/CSS file that no longer exists (blank page). Hashed assets
    # themselves are immutable and stay cacheable.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
