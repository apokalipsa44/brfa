<div class="flex h-dvh flex-col overflow-hidden bg-slate-50 text-slate-900">
  <app-top-bar
    [showSidebarToggle]="view() === 'analysis'"
    (openSidebar)="sidebarOpen.set(true)"
  />

  <div class="mx-auto flex w-full max-w-[1440px] flex-1 flex-col overflow-hidden px-6 py-4">
    <!-- Tabs: the job-analysis workspace vs. the gaps curator. -->
    <div role="tablist" aria-label="Workspace views" class="flex shrink-0 gap-1 border-b border-slate-200">
      <button
        type="button"
        role="tab"
        class="-mb-px border-b-2 px-3 py-2 text-sm font-medium transition-colors duration-150 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
        [class]="
          view() === 'analysis'
            ? 'border-indigo-600 text-indigo-700'
            : 'border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-700'
        "
        [attr.aria-selected]="view() === 'analysis'"
        (click)="setView('analysis')"
      >
        Job analysis
      </button>
      <button
        type="button"
        role="tab"
        class="-mb-px border-b-2 px-3 py-2 text-sm font-medium transition-colors duration-150 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
        [class]="
          view() === 'gaps'
            ? 'border-indigo-600 text-indigo-700'
            : 'border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-700'
        "
        [attr.aria-selected]="view() === 'gaps'"
        (click)="setView('gaps')"
      >
        Gaps curator
      </button>
    </div>

    <div class="mt-4 flex min-h-0 flex-1 gap-5">
      @if (view() === 'analysis') {
        <!-- Sidebar: fixed on large screens, drawer on small ones. -->
        <aside
          class="hidden w-[24rem] shrink-0 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white p-3.5 lg:flex xl:w-[27rem]"
          aria-label="Analyses"
        >
          <app-analysis-sidebar (newAnalysis)="newAnalysis()" />
        </aside>

        <!-- Mobile drawer. -->
        @if (sidebarOpen()) {
          <div class="fixed inset-0 z-30 lg:hidden">
            <button
              type="button"
              class="absolute inset-0 bg-slate-900/40"
              aria-label="Close analyses"
              (click)="sidebarOpen.set(false)"
            ></button>
            <aside
              class="relative m-3 flex max-h-[calc(100dvh-1.5rem)] w-[24rem] max-w-[calc(100vw-1.5rem)] flex-col overflow-hidden rounded-xl border border-slate-200 bg-white p-3.5"
              aria-label="Analyses"
            >
              <app-analysis-sidebar (newAnalysis)="newAnalysis()" />
            </aside>
          </div>
        }
      }

      <!-- Main panel. -->
      <main class="min-w-0 flex-1 overflow-y-auto">
        @if (view() === 'gaps') {
          <app-skill-gaps />
        } @else if (!cv.hasCv()) {
          <div class="flex min-h-full items-center justify-center">
            <app-cv-dropzone class="w-full max-w-lg" />
          </div>
        } @else if (analyses.selectedId()) {
          <app-analysis-detail />
        } @else {
          <app-new-analysis-form />
        }
      </main>
    </div>
  </div>

  <!-- Live region for status changes, plus the single floating toast. -->
  <div aria-live="polite" class="sr-only">
    @if (analyses.selectedSummary(); as summary) {
      {{ summary.title }} — {{ summary.stage }}
    }
  </div>
  <div class="pointer-events-none fixed inset-x-0 bottom-4 z-40 flex justify-center px-4">
    <app-toast />
  </div>
</div>
