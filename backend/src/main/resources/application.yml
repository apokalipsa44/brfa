server:
  port: 8080

spring:
  application:
    name: cv-checker-backend
  threads:
    virtual:
      enabled: true   # open SSE connections must not occupy the servlet thread pool (plan §4.1)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  ai:
    openai:
      api-key: lm-studio   # any non-empty string; LM Studio ignores it (plan §6.3)
      # NOTE: must include /v1 — Spring AI appends only /chat/completions (M7)
      base-url: ${LLM_BASE_URL:http://localhost:1234/v1}
      chat:
        options:
          model: ${LLM_MODEL:unconfigured}   # read from GET /v1/models; never hardcoded (AGENTS.md)
          temperature: 0.2   # low: reliability over creativity (plan §6.3)
          max-tokens: 8192   # reasoning models (e.g. gemma-4-e4b) spend completion budget on hidden reasoning before the JSON
management:
  endpoints:
    web:
      base-path: /api/actuator   # keeps every backend URL under the single /api prefix (plan §6.1)
cvchecker:
  llm:
    read-timeout: 10m   # a local model may answer over minutes (plan §6.3)
  lmstudio:
    # native v1 REST API root, without the OpenAI-compat /v1 suffix (docs/API.md §3)
    base-url: ${LM_STUDIO_BASE_URL:http://localhost:1234}
    load-timeout: 120s   # loading a model into VRAM can take tens of seconds — not a timeout (docs/API.md §3)
    probe-timeout: 10s   # the 1-token readiness probe must not wait for a slow answering model (docs/API.md §3)
  events:
    replay-buffer: 1000  # bound the single SSE stream's reconnect buffer (docs/API.md §7)
  analyses:
    max-concurrent: 1   # a local LLM processes one analysis at a time (plan §6.7)
    ttl: 24h            # completed analyses and their result PDFs older than this are removed
  pipeline:
    mode: real          # real = PDFBox + LLM + PDF render; simulated = stage delays only (tests/demos)
    stage-delay: 2s     # simulated-pipeline delay per stage (only used when mode=simulated)
  sse:
    heartbeat-interval: 15s
  pdf:
    font-family: DejaVuSans
    font-ttf: DejaVuSans.ttf
