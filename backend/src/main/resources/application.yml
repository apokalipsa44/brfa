server:
  port: 8080

spring:
  application:
    name: cv-checker-backend
  jackson:
    deserialization:
      # LLM JSON and pre-existing SQLite rows may carry an explicit null for a primitive boolean
      # (e.g. Suggestion.needsConfirmation). Coerce null to the primitive default instead of failing
      # (Jackson 3 fails by default). See docs/DECISIONS.md.
      fail-on-null-for-primitives: false
  threads:
    virtual:
      enabled: true   # open SSE connections must not occupy the servlet thread pool (plan §4.1)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    # analyses are persisted in SQLite (docs/API.md §8); the file is gitignored and configurable
    url: jdbc:sqlite:${CV_DB_PATH:./data/cvchecker.db}
    hikari:
      maximum-pool-size: 1   # SQLite has a single writer; one connection avoids SQLITE_BUSY
  ai:
    openai:
      api-key: lm-studio   # any non-empty string; LM Studio ignores it (plan §6.3)
      # NOTE: must include /v1 — Spring AI appends only /chat/completions (M7)
      base-url: ${LLM_BASE_URL:http://localhost:1234/v1}
      # Per-request timeout applied by the OpenAI SDK (default 60s). A cold large prompt waits
      # longer than 60s for the first streamed token, so keep it aligned with the OkHttp timeouts
      # in AiConfig (docs/DECISIONS.md).
      timeout: ${cvchecker.llm.read-timeout:10m}
      chat:
        options:
          model: ${LLM_MODEL:unconfigured}   # read from GET /v1/models; never hardcoded (AGENTS.md)
          temperature: 0.2   # low: reliability over creativity (plan §6.3)
          max-tokens: 8192   # reasoning models (e.g. gemma-4-e4b) spend completion budget on hidden reasoning before the JSON
management:
  endpoints:
    web:
      base-path: /api/actuator   # keeps every backend URL under the single /api prefix (plan §6.1)
cvchecker:
  persistence: sqlite   # sqlite = analyses survive restarts (docs/API.md §8); memory = tests only
  llm:
    read-timeout: 10m   # a local model may answer over minutes (plan §6.3.3)
    connect-timeout: 10s   # TCP connect to LM Studio; the server is local, so this stays short
    reasoning-effort: none   # disable model "thinking" for the JSON steps (huge latency win); blank = model default
    max-output-tokens: 4096  # structured outputs are short once thinking is off (was 8192)
  lmstudio:
    # native v1 REST API root, without the OpenAI-compat /v1 suffix (docs/API.md §3)
    base-url: ${LM_STUDIO_BASE_URL:http://localhost:1234}
    connect-timeout: 3s     # TCP connect to LM Studio; the server is local, so this stays short
    list-timeout: 5s        # GET /api/v1/models answers fast; a slow answer means "unreachable"
    load-timeout: 120s   # loading a model into VRAM can take tens of seconds — not a timeout (docs/API.md §3)
    probe-timeout: 10s   # the 1-token readiness probe must not wait for a slow answering model (docs/API.md §3)
  events:
    replay-buffer: 1000  # bound the single SSE stream's reconnect buffer (docs/API.md §7)
  analyses:
    max-concurrent: 1   # a local LLM processes one analysis at a time (plan §6.7)
    ttl: 24h            # completed analyses and their result PDFs older than this are removed
  skill-gaps:
    group-every: 5          # auto-regroup after this many completed analyses (docs/API.md §9)
    max-output-tokens: 8192 # grouping/ranking output is bigger than one evaluation (many skills)
  pipeline:
    mode: real          # real = PDFBox + LLM + PDF render; simulated = stage delays only (tests/demos)
    stage-delay: 2s     # simulated-pipeline delay per stage (only used when mode=simulated)
  sse:
    heartbeat-interval: 15s
  posting-fetch:      # bounds for resolving a link posting (docs/API.md §4.1/§8)
    connect-timeout: 5s
    read-timeout: 15s
    total-timeout: 30s
    max-bytes: 2000000        # 2 MB
    max-redirects: 5
    min-text-length: 400      # below this, escalate to the headless render
    browser-enabled: true
    user-agent: "CvCheckerBot/1.0 (+https://cvchecker.local; job-posting-reader)"
    max-concurrent-browser: 1
  pdf:
    font-family: DejaVuSans
    font-ttf: DejaVuSans.ttf
